<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Lean Athletic Coach</title>
  <style>
    :root{
      --bg:#f4f7fb; --card:#fff; --ink:#111827; --muted:#667085; --line:#e5e7eb;
      --navy:#0f172a; --blue:#2563eb; --blue2:#dbeafe; --green:#16a34a; --green2:#dcfce7;
      --amber:#d97706; --amber2:#fef3c7; --red:#dc2626; --red2:#fee2e2; --radius:20px;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;line-height:1.45}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 16px 92px}
    header{padding:24px 4px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
    h1{font-size:28px;line-height:1.15;margin:4px 0 4px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:14px}
    .date-pill{white-space:nowrap;padding:9px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:#344054}
    .panel{background:var(--card);border:1px solid rgba(15,23,42,.06);border-radius:var(--radius);box-shadow:0 8px 24px rgba(15,23,42,.05);padding:18px;margin-bottom:14px}
    .hero{background:linear-gradient(145deg,#0f172a,#1e293b);color:white;border:0;overflow:hidden;position:relative}
    .hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);right:-60px;top:-75px}
    .hero .sub{color:#cbd5e1}.hero h2{margin:4px 0 8px;font-size:24px}.hero .tag{display:inline-block;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-top:8px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .metric{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.metric .k{font-size:12px;color:var(--muted);font-weight:700}.metric .v{font-size:22px;font-weight:850;margin-top:2px;letter-spacing:-.03em}.metric .d{font-size:11px;margin-top:4px;color:var(--muted)}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}.section-title h2,.section-title h3{margin:0;font-size:18px;letter-spacing:-.02em}.section-title small{color:var(--muted)}
    .progress{height:10px;background:#eef2f6;border-radius:999px;overflow:hidden}.bar{height:100%;border-radius:999px;background:var(--blue);transition:width .3s ease}.bar.green{background:var(--green)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:10px}
    .btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;background:var(--navy);color:#fff}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.ghost{background:#fff;color:#344054;border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.red{background:#fff1f2;color:#be123c}.btn.small{padding:8px 10px;border-radius:10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .exercise{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.exercise.current{border:2px solid #93c5fd;box-shadow:0 8px 20px rgba(37,99,235,.08)}.exercise.done{background:#f8fafc;opacity:.8}.ex-top{display:flex;gap:12px;align-items:flex-start}.num{width:34px;height:34px;flex:0 0 34px;border-radius:12px;background:#eff6ff;color:#1d4ed8;display:grid;place-items:center;font-weight:900}.done .num{background:var(--green2);color:var(--green)}
    .ex-name{font-weight:850;font-size:17px;letter-spacing:-.02em}.ex-meta{color:var(--muted);font-size:13px;margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#f2f4f7;color:#475467}.chip.blue{background:var(--blue2);color:#1d4ed8}.chip.green{background:var(--green2);color:#15803d}.chip.amber{background:var(--amber2);color:#b45309}
    .cue{font-size:13px;color:#344054;background:#f8fafc;border-radius:12px;padding:10px 11px;margin-top:12px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions a{text-decoration:none}
    label{display:block;font-size:12px;color:#475467;font-weight:750;margin-bottom:5px}.field{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:11px 12px;background:#fff;color:#111827;outline:none}.field:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .full{grid-column:1/-1}
    .note{font-size:12px;color:var(--muted)}.notice{padding:11px 12px;border-radius:12px;font-size:13px}.notice.blue{background:#eff6ff;color:#1e40af}.notice.green{background:#f0fdf4;color:#166534}.notice.amber{background:#fffbeb;color:#92400e}
    .history-item{display:grid;grid-template-columns:1.1fr .8fr .8fr .8fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f2f5;font-size:13px}.history-item:last-child{border-bottom:0}.history-item b{font-weight:800}
    .chart{width:100%;height:210px;border-radius:14px;background:#fbfcfe;border:1px solid var(--line);display:block}
    .week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:9px 2px;text-align:center;border-radius:12px;background:#f8fafc;border:1px solid #eef2f6;font-size:11px;color:#667085}.day strong{display:block;font-size:12px;color:#344054}.day.complete{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}.day.today{outline:2px solid #93c5fd}
    .day-selector{width:auto;min-width:120px;padding:8px 10px}
    .tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:20}.tabs-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tab{border:0;background:transparent;border-radius:13px;padding:8px 4px;color:#667085;font-size:11px;font-weight:800}.tab span{display:block;font-size:19px;margin-bottom:1px}.tab.active{background:#eef2ff;color:#3730a3}
    .view{display:none}.view.active{display:block}.empty{text-align:center;padding:30px 12px;color:var(--muted)}
    .goal-line{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin:10px 0}.goal-line .label{font-size:12px;color:#475467;font-weight:800}.status{font-size:11px;font-weight:850;padding:4px 7px;border-radius:999px}.status.ok{background:var(--green2);color:#15803d}.status.wait{background:var(--amber2);color:#b45309}
    details{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}details+details{margin-top:8px}summary{cursor:pointer;font-weight:800}
    .footer-note{text-align:center;color:#98a2b3;font-size:11px;padding:4px 10px 0}
    @media(max-width:520px){.grid3{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.history-item{grid-template-columns:1fr 1fr 1fr}.history-item .hide-mobile{display:none}h1{font-size:25px}.panel{padding:15px}.app{padding-left:12px;padding-right:12px}.goal-line{grid-template-columns:85px 1fr auto}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Lean Athletic Coach</h1><div class="sub">184 cm · 체중 ≤ 78 kg · 체지방 10–12%</div></div>

<nav class="tabs"><div class="tabs-inner">

<script>

function defaultState(){return {goal:{...GOAL_DEFAULT},inbody:[],workouts:{},notes:{},createdAt:new Date().toISOString()}}
let state=loadState();
function loadState(){try{const x=JSON.parse(localStorage.getItem('leanAthleticCoachV1'));return x?{...defaultState(),...x,goal:{...GOAL_DEFAULT,...(x.goal||{})}}:defaultState()}catch(e){return defaultState()}}
function save(){localStorage.setItem('leanAthleticCoachV1',JSON.stringify(state))}
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formatDate(s){const d=new Date(s+'T12:00:00');return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function currentKoreanDate(){return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date())}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function latestInbody(){return [...state.inbody].sort((a,b)=>a.date.localeCompare(b.date)).at(-1)||null}
function previousInbody(){const a=[...state.inbody].sort((x,y)=>x.date.localeCompare(y.date));return a.length>1?a[a.length-2]:null}
function bfStatus(v){if(v==null||v==='')return ['미입력','wait'];v=+v;if(v<state.goal.bfMin)return [`목표보다 ${fmt(state.goal.bfMin-v,1)}%p 낮음`,'wait'];if(v>state.goal.bfMax)return [`목표까지 ${fmt(v-state.goal.bfMax,1)}%p`,'wait'];return ['목표 구간','ok']}
function weightStatus(v){if(v==null||v==='')return ['미입력','wait'];v=+v;return v<=state.goal.maxWeight?['목표 범위','ok']:[`목표까지 ${fmt(v-state.goal.maxWeight,1)} kg`,'wait']}
function fmt(v,d=1){return Number.isFinite(+v)?(+v).toFixed(d):'-'}
function workoutFor(dateStr){const d=new Date(dateStr+'T12:00:00');return routine[d.getDay()]}
function workoutState(dateStr){if(!state.workouts[dateStr])state.workouts[dateStr]={index:0,done:false,logs:{},started:false};return state.workouts[dateStr]}

let viewedDate=dateKey();

document.getElementById('todayPill').textContent=currentKoreanDate();
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.view));if(b.dataset.view==='todayView')renderToday();if(b.dataset.view==='inbodyView')renderInbody();if(b.dataset.view==='routineView')renderRoutine();if(b.dataset.view==='settingsView')renderSettings();window.scrollTo({top:0,behavior:'smooth'})}));

function renderToday(){
  const root=document.getElementById('todayView'); const r=workoutFor(viewedDate); const ws=workoutState(viewedDate); const actualToday=viewedDate===dateKey();
  const latest=latestInbody(); const total=r.items.length; const completed=ws.done?total:Math.min(ws.index,total); const pct=Math.round((completed/total)*100);
  const thisWeek=getWeek(viewedDate); const weekDone=thisWeek.filter(x=>state.workouts[x.key]?.done).length;
  const dayOptions=Object.entries(routine).map(([i,v])=>`<option value="${i}" ${+i===new Date(viewedDate+'T12:00:00').getDay()?'selected':''}>${DAY_NAMES[i]} · ${esc(v.title)}</option>`).join('');
  root.innerHTML=`
    <div class="panel hero">
      <div class="row"><div><div class="eyebrow" style="color:#93c5fd">${actualToday?'TODAY':'PREVIEW'} · ${DAY_NAMES[new Date(viewedDate+'T12:00:00').getDay()]}요일</div><h2>${esc(r.title)}</h2><div class="sub">${esc(r.subtitle)}</div><span class="tag">${esc(r.focus)}</span></div><div style="text-align:right"><div style="font-size:30px;font-weight:900">${pct}%</div><div class="sub">오늘 완료</div></div></div>
      <div class="progress" style="margin-top:18px;background:rgba(255,255,255,.14)"><div class="bar green" style="width:${pct}%"></div></div>
    </div>

    <div class="panel">
      <div class="section-title"><h3>이번 주</h3><small>${weekDone}/7일 완료</small></div>
      ${renderWeek(thisWeek)}
    </div>

    <div class="panel">
      <div class="row"><div><div style="font-weight:850">다른 요일 미리보기</div><div class="note">계획 확인용. 기록은 선택한 날짜에 저장됩니다.</div></div><select id="dayPreview" class="field day-selector">${dayOptions}</select></div>
    </div>

    ${latest?renderLatestMini(latest):`<div class="panel"><div class="notice blue"><b>첫 인바디를 등록하세요.</b><br>시작 전 측정값을 입력하면 목표치와 월별 변화를 추적할 수 있습니다.</div><div class="actions"><button class="btn secondary" onclick="goTab('inbodyView')">인바디 입력</button></div></div>`}

    <div class="panel">
      <div class="section-title"><h2>오늘의 세션</h2><small>${completed}/${total} 완료</small></div>
      <div id="exerciseList" class="stack">${renderExercises(r,ws)}</div>
    </div>
    ${ws.done?`<div class="panel"><div class="notice green"><b>세션 완료 ✓</b><br>오늘 계획을 모두 마쳤습니다. 다음 세션을 위해 회복하세요.</div><div class="actions"><button class="btn ghost" onclick="resetWorkout('${viewedDate}')">오늘 기록 다시 열기</button></div></div>`:''}
  `;
  document.getElementById('dayPreview').addEventListener('change',e=>{
    const targetDay=+e.target.value; const base=new Date(viewedDate+'T12:00:00'); const diff=targetDay-base.getDay(); base.setDate(base.getDate()+diff); viewedDate=dateKey(base); renderToday();
  });
}

function renderExercises(r,ws){
  return r.items.map((ex,i)=>{
    const isDone=ws.done||i<ws.index, current=!ws.done&&i===ws.index, locked=!ws.done&&i>ws.index; const log=ws.logs?.[i]||{};
    return `<div class="exercise ${isDone?'done':''} ${current?'current':''}" ${locked?'style="opacity:.45"':''}>
      <div class="ex-top"><div class="num">${isDone?'✓':i+1}</div><div style="flex:1"><div class="ex-name">${esc(ex.name)}${ex.optional?' <span class="chip amber">선택</span>':''}</div><div class="ex-meta">${esc(ex.sets)}</div><div class="chips"><span class="chip blue">${esc(ex.rir||'')}</span>${ex.rest&&ex.rest!=='-'?`<span class="chip">휴식 ${esc(ex.rest)}</span>`:''}</div></div></div>
      <div class="cue">${esc(ex.cue)}</div>
      ${current?`<div style="margin-top:12px"><label>오늘 기록 (선택)</label><input id="log-${i}" class="field" value="${esc(log.note||'')}" placeholder="예: 80kg · 8/8/7, 마지막 세트 RIR 1" /></div>`:''}
      <div class="actions">
        <a class="btn secondary small" href="${ex.video}" target="_blank" rel="noopener">▶ 폼 영상</a>
        ${current?`<button class="btn green small" onclick="completeExercise('${viewedDate}',${i})">${ex.optional?'완료 / 시행':'운동 완료'} →</button>${ex.optional?`<button class="btn ghost small" onclick="skipExercise('${viewedDate}',${i})">오늘 생략 →</button>`:''}`:''}
        ${isDone&&!ws.done?`<button class="btn ghost small" onclick="undoTo('${viewedDate}',${i})">이 운동부터 수정</button>`:''}
      </div>
    </div>`
  }).join('')
}
function completeExercise(d,i){const ws=workoutState(d);const el=document.getElementById('log-'+i);ws.logs[i]={note:el?el.value.trim():''};ws.started=true;ws.index=i+1;if(ws.index>=workoutFor(d).items.length)ws.done=true;save();renderToday();}
function skipExercise(d,i){const ws=workoutState(d);ws.logs[i]={note:'선택 운동 생략'};ws.started=true;ws.index=i+1;if(ws.index>=workoutFor(d).items.length)ws.done=true;save();renderToday();}
function undoTo(d,i){const ws=workoutState(d);ws.done=false;ws.index=i;save();renderToday();}
function resetWorkout(d){state.workouts[d]={index:0,done:false,logs:{},started:false};save();renderToday();}
function renderLatestMini(x){const [ws,wc]=weightStatus(x.weight),[bs,bc]=bfStatus(x.bodyFat);return `<div class="panel"><div class="section-title"><h3>최근 인바디</h3><small>${formatDate(x.date)}</small></div><div class="grid"><div class="metric"><div class="k">체중</div><div class="v">${fmt(x.weight)} <small>kg</small></div><div class="d"><span class="status ${wc}">${ws}</span></div></div><div class="metric"><div class="k">체지방률</div><div class="v">${fmt(x.bodyFat)}<small>%</small></div><div class="d"><span class="status ${bc}">${bs}</span></div></div></div></div>`}
function getWeek(anchor){const d=new Date(anchor+'T12:00:00');const day=d.getDay();const diff=(day===0?-6:1-day);d.setDate(d.getDate()+diff);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return {key:dateKey(x),name:DAY_NAMES[x.getDay()],date:x.getDate()}})}
function renderWeek(arr){return `<div class="week">${arr.map(x=>`<div class="day ${state.workouts[x.key]?.done?'complete':''} ${x.key===dateKey()?'today':''}"><strong>${x.name}</strong>${x.date}${state.workouts[x.key]?.done?'<div>✓</div>':''}</div>`).join('')}</div>`}

function renderInbody(){
  const root=document.getElementById('inbodyView'); const latest=latestInbody(),prev=previousInbody();
  root.innerHTML=`
    <div class="panel hero"><div class="eyebrow" style="color:#93c5fd">BODY COMPOSITION</div><h2>인바디 월별 추적</h2><div class="sub">체중은 78 kg 이하를 유지하면서 체지방률 10–12% 구간을 목표로 합니다.</div></div>
    ${latest?renderGoalPanel(latest,prev):''}
    <div class="panel"><div class="section-title"><h2>측정값 추가</h2><small>월 1회 권장</small></div>
      <form id="inbodyForm" class="form-grid">
        <div><label>측정일 *</label><input class="field" type="date" name="date" required value="${dateKey()}" /></div>
        <div><label>체중 (kg) *</label><input class="field" type="number" step="0.1" min="30" max="200" name="weight" required placeholder="76.0" /></div>
        <div><label>체지방률 (%) *</label><input class="field" type="number" step="0.1" min="2" max="60" name="bodyFat" required placeholder="14.0" /></div>
        <div><label>골격근량 (kg)</label><input class="field" type="number" step="0.1" min="10" max="80" name="skeletalMuscle" placeholder="선택" /></div>
        <div><label>체지방량 (kg)</label><input class="field" type="number" step="0.1" min="1" max="100" name="fatMass" placeholder="선택" /></div>
        <div><label>BMI</label><input class="field" type="number" step="0.1" min="10" max="60" name="bmi" placeholder="선택" /></div>
        <div><label>내장지방 레벨</label><input class="field" type="number" step="1" min="1" max="30" name="visceral" placeholder="선택" /></div>
        <div><label>기초대사량 (kcal)</label><input class="field" type="number" step="1" min="500" max="4000" name="bmr" placeholder="선택" /></div>
        <div class="full"><label>메모</label><input class="field" name="memo" placeholder="예: 공복, 오전 측정 / 전날 하체 운동" /></div>
        <div class="full"><button class="btn" type="submit">인바디 기록 저장</button></div>
      </form>
      <div class="note" style="margin-top:10px">비교 정확도를 높이려면 매번 비슷한 시간대·수분상태·식사조건에서 측정하세요.</div>
    </div>
    ${state.inbody.length?`<div class="panel"><div class="section-title"><h2>추세</h2><small>체중 / 체지방률</small></div><canvas id="trendChart" class="chart" width="680" height="210"></canvas></div>`:''}
    <div class="panel"><div class="section-title"><h2>측정 기록</h2><small>${state.inbody.length}회</small></div>${renderInbodyHistory()}</div>
  `;
  document.getElementById('inbodyForm').addEventListener('submit',addInbody);
  if(state.inbody.length)requestAnimationFrame(drawTrend);
}
function renderGoalPanel(x,p){const [ws,wc]=weightStatus(x.weight),[bs,bc]=bfStatus(x.bodyFat);const dw=p?x.weight-p.weight:null,db=p?x.bodyFat-p.bodyFat:null;return `<div class="panel"><div class="section-title"><h2>목표 진행</h2><small>${formatDate(x.date)} 기준</small></div>
  <div class="goal-line"><div class="label">체중 ≤ ${state.goal.maxWeight}kg</div><div class="progress"><div class="bar ${wc==='ok'?'green':''}" style="width:${Math.max(5,Math.min(100,100-(Math.max(0,x.weight-state.goal.maxWeight)*20)))}%"></div></div><span class="status ${wc}">${ws}</span></div>
  <div class="goal-line"><div class="label">체지방 ${state.goal.bfMin}–${state.goal.bfMax}%</div><div class="progress"><div class="bar ${bc==='ok'?'green':''}" style="width:${bfProgress(x.bodyFat)}%"></div></div><span class="status ${bc}">${bs}</span></div>
  <div class="grid3" style="margin-top:14px"><div class="metric"><div class="k">현재 체중</div><div class="v">${fmt(x.weight)}<small> kg</small></div><div class="d">${p?`전월 대비 ${signed(dw,' kg')}`:'첫 측정'}</div></div><div class="metric"><div class="k">현재 체지방률</div><div class="v">${fmt(x.bodyFat)}<small>%</small></div><div class="d">${p?`전월 대비 ${signed(db,'%p')}`:'첫 측정'}</div></div><div class="metric"><div class="k">골격근량</div><div class="v">${x.skeletalMuscle?fmt(x.skeletalMuscle):'-'}<small>${x.skeletalMuscle?' kg':''}</small></div><div class="d">${p&&x.skeletalMuscle&&p.skeletalMuscle?signed(x.skeletalMuscle-p.skeletalMuscle,' kg'):'추적 권장'}</div></div></div>
  <div class="notice blue" style="margin-top:12px">목표 판정은 <b>체중과 체지방률을 별도로</b> 보여줍니다. 단일 점수로 합치지 않아 근육 증가를 체중 증가로 잘못 평가하지 않도록 했습니다.</div>
</div>`}
function bfProgress(v){v=+v;if(v>=state.goal.bfMin&&v<=state.goal.bfMax)return 100;if(v>state.goal.bfMax)return Math.max(8,100-(v-state.goal.bfMax)*12);return Math.max(8,100-(state.goal.bfMin-v)*12)}
function signed(v,unit){if(v==null||!Number.isFinite(+v))return '-';return `${v>0?'+':''}${(+v).toFixed(1)}${unit}`}
function addInbody(e){e.preventDefault();const fd=new FormData(e.target),obj={};for(const [k,v] of fd.entries())obj[k]=v.trim();['weight','bodyFat','skeletalMuscle','fatMass','bmi','visceral','bmr'].forEach(k=>obj[k]=obj[k]===''?null:+obj[k]);const ix=state.inbody.findIndex(x=>x.date===obj.date);if(ix>=0){if(!confirm('같은 날짜 기록이 있습니다. 덮어쓸까요?'))return;state.inbody[ix]=obj}else state.inbody.push(obj);state.inbody.sort((a,b)=>a.date.localeCompare(b.date));save();renderInbody();}
function renderInbodyHistory(){if(!state.inbody.length)return '<div class="empty">아직 저장된 인바디가 없습니다.</div>';return [...state.inbody].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="history-item"><div><b>${formatDate(x.date)}</b><div class="note">${esc(x.memo||'')}</div></div><div><b>${fmt(x.weight)}</b> kg</div><div><b>${fmt(x.bodyFat)}</b>%</div><div class="hide-mobile">근육 ${x.skeletalMuscle?fmt(x.skeletalMuscle)+' kg':'-'}</div><button class="btn red small" onclick="deleteInbody('${x.date}')">삭제</button></div>`).join('')}
function deleteInbody(d){if(confirm(`${formatDate(d)} 기록을 삭제할까요?`)){state.inbody=state.inbody.filter(x=>x.date!==d);save();renderInbody()}}
function drawTrend(){const c=document.getElementById('trendChart');if(!c)return;const ctx=c.getContext('2d'),data=[...state.inbody].sort((a,b)=>a.date.localeCompare(b.date));const W=c.width,H=c.height,p=38;ctx.clearRect(0,0,W,H);ctx.font='11px sans-serif';ctx.fillStyle='#667085';ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;for(let i=0;i<4;i++){const y=p+i*(H-2*p)/3;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(W-p,y);ctx.stroke()}
  if(data.length===1){ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(W/2,H/2,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#475467';ctx.fillText(`${data[0].weight}kg / ${data[0].bodyFat}%`,W/2-38,H/2-12);return}
  const weights=data.map(x=>x.weight),bfs=data.map(x=>x.bodyFat),wMin=Math.min(...weights)-1,wMax=Math.max(...weights)+1,bMin=Math.min(...bfs,state.goal.bfMin)-1,bMax=Math.max(...bfs,state.goal.bfMax)+1;const xAt=i=>p+i*(W-2*p)/(data.length-1),yW=v=>H-p-(v-wMin)/(wMax-wMin)*(H-2*p),yB=v=>H-p-(v-bMin)/(bMax-bMin)*(H-2*p);
  ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();data.forEach((x,i)=>i?ctx.lineTo(xAt(i),yW(x.weight)):ctx.moveTo(xAt(i),yW(x.weight)));ctx.stroke();ctx.strokeStyle='#16a34a';ctx.beginPath();data.forEach((x,i)=>i?ctx.lineTo(xAt(i),yB(x.bodyFat)):ctx.moveTo(xAt(i),yB(x.bodyFat)));ctx.stroke();
  data.forEach((x,i)=>{ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(xAt(i),yW(x.weight),4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#16a34a';ctx.beginPath();ctx.arc(xAt(i),yB(x.bodyFat),4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#667085';ctx.fillText(x.date.slice(5),xAt(i)-14,H-12)});ctx.fillStyle='#2563eb';ctx.fillRect(p,10,10,3);ctx.fillStyle='#475467';ctx.fillText('체중',p+15,14);ctx.fillStyle='#16a34a';ctx.fillRect(p+58,10,10,3);ctx.fillStyle='#475467';ctx.fillText('체지방률',p+73,14)
}

function renderRoutine(){const root=document.getElementById('routineView');root.innerHTML=`<div class="panel hero"><div class="eyebrow" style="color:#93c5fd">WEEKLY PROGRAM</div><h2>최종 운동 루틴</h2><div class="sub">Gym 4회 · 맨몸 2회 · 수영 2회 + 금요일 선택</div></div>${Object.entries(routine).map(([i,r])=>`<div class="panel"><div class="section-title"><div><div class="eyebrow">${DAY_NAMES[i]}요일</div><h2>${esc(r.title)}</h2><div class="sub">${esc(r.subtitle)}</div></div><span class="chip blue">${esc(r.focus)}</span></div><div class="stack">${r.items.map((ex,n)=>`<details><summary>${n+1}. ${esc(ex.name)} · ${esc(ex.sets)}</summary><div class="cue">${esc(ex.cue)}</div><div class="chips"><span class="chip blue">${esc(ex.rir||'')}</span>${ex.rest&&ex.rest!=='-'?`<span class="chip">휴식 ${esc(ex.rest)}</span>`:''}</div><div class="actions"><a class="btn secondary small" href="${ex.video}" target="_blank" rel="noopener">▶ 폼 영상</a></div></details>`).join('')}</div></div>`).join('')}`}

function renderSettings(){const root=document.getElementById('settingsView');root.innerHTML=`
  <div class="panel hero"><div class="eyebrow" style="color:#93c5fd">SETTINGS & BACKUP</div><h2>목표와 데이터</h2><div class="sub">목표값을 조정하거나 기록을 백업·복원할 수 있습니다.</div></div>
  <div class="panel"><div class="section-title"><h2>목표 설정</h2></div><form id="goalForm" class="form-grid"><div><label>최대 체중 (kg)</label><input class="field" name="maxWeight" type="number" step="0.1" value="${state.goal.maxWeight}"></div><div><label>신장 (cm)</label><input class="field" name="height" type="number" step="0.1" value="${state.goal.height}"></div><div><label>체지방률 하한 (%)</label><input class="field" name="bfMin" type="number" step="0.1" value="${state.goal.bfMin}"></div><div><label>체지방률 상한 (%)</label><input class="field" name="bfMax" type="number" step="0.1" value="${state.goal.bfMax}"></div><div class="full"><button class="btn" type="submit">목표 저장</button></div></form></div>
  <div class="panel"><div class="section-title"><h2>데이터 백업</h2></div><div class="notice amber">브라우저 기록을 삭제하거나 다른 기기로 옮기면 localStorage 데이터가 사라질 수 있습니다. 인바디 기록이 쌓이면 정기적으로 백업 파일을 저장하세요.</div><div class="actions"><button class="btn secondary" onclick="exportData()">JSON 백업 내보내기</button><label class="btn ghost" style="display:inline-block;margin:0">백업 가져오기<input id="importFile" type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label></div></div>
  <div class="panel"><div class="section-title"><h2>사용법</h2></div><div class="stack"><div class="notice blue"><b>1.</b> 시작 전 인바디를 입력합니다.</div><div class="notice blue"><b>2.</b> 매일 ‘오늘’ 탭에서 현재 운동을 확인합니다.</div><div class="notice blue"><b>3.</b> 한 운동을 끝낼 때마다 ‘운동 완료’를 눌러 다음 운동으로 이동합니다.</div><div class="notice blue"><b>4.</b> 한 달마다 인바디를 추가하고 체중·체지방률 추세를 확인합니다.</div></div></div>
  <div class="panel"><div class="section-title"><h2>초기화</h2></div><button class="btn red" onclick="wipeData()">모든 기록 삭제</button></div>`;
  document.getElementById('goalForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);state.goal={maxWeight:+fd.get('maxWeight'),height:+fd.get('height'),bfMin:+fd.get('bfMin'),bfMax:+fd.get('bfMax')};save();renderSettings()});
}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lean-athletic-coach-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!confirm('현재 기록을 백업 파일의 데이터로 교체할까요?'))return;state={...defaultState(),...x,goal:{...GOAL_DEFAULT,...(x.goal||{})}};save();renderSettings();alert('복원이 완료되었습니다.')}catch(e){alert('올바른 백업 파일이 아닙니다.')}};r.readAsText(file)}
function wipeData(){if(confirm('인바디와 운동 완료 기록을 모두 삭제합니다. 계속할까요?')){localStorage.removeItem('leanAthleticCoachV1');state=defaultState();viewedDate=dateKey();renderSettings()}}
function goTab(id){const b=[...document.querySelectorAll('.tab')].find(x=>x.dataset.view===id);if(b)b.click()}

renderToday();renderInbody();renderRoutine();renderSettings();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
</body>
